[project]
authors = [
  { name = "mst-mkt", email = "131662659+mst-mkt@users.noreply.github.com" },
]
dependencies = [
  "matplotlib>=3.10.1",
  "networkx>=3.4.2",
  "numpy>=2.1.3",
  "pandas>=2.2.3",
]
description = "🧶's jupyter-notebook template with rye, uv, ruff"
name = "jupyter-template"
readme = "README.md"
requires-python = ">= 3.12"
version = "0.1.0"

[tool.rye]
dev-dependencies = ["jupyter>=1.0.0", "ipykernel>=6.29.4", "ruff>=0.3.7"]
managed = true

[tool.rye.scripts]
convert = "jupyter nbconvert --to html"
format = "ruff format"
lint = "ruff check"
lint-fix = "ruff check --fix"
